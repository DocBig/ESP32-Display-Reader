[platformio]
default_envs = universal_esp32

[env:universal_esp32]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs
board_build.partitions = partitions_ota.csv
board_build.psram = enabled

extra_scripts = pre:version_build.py, merge_bin.py

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit NeoPixel @ ^1.12.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMQTT_MAX_PACKET_SIZE=2048

monitor_filters =
    esp32_exception_decoder

[env:atoms3r_m12]
; NOT the "espressif32@6.7.0" version M5Stack's generic AtomS3R tutorials
; recommend - that combo bundles arduino-esp32 2.0.16, whose LEDC API
; (ledcSetup/ledcAttachPin) predates the ledcAttachChannel/ledcDetach calls
; src/light_service.cpp already relies on, and fails to compile.
; Tasmota's platform-espressif32 fork (previously pinned here at 2024.02.10,
; then tried at 2026.03.50) trims its precompiled esp32-arduino-libs down to
; qio_opi/qio_qspi/opi_opi only - no dio_opi/dio_qspi variant exists in
; either release, so board_build.arduino.memory_type=dio_opi below fails
; with "sdkconfig.h: No such file". pioarduino/platform-espressif32 (the
; actively maintained fork tasmota's own maintainer now publishes releases
; under) ships the full upstream espressif/arduino-esp32 release unmodified,
; including dio_opi/dio_qspi, while keeping the same modern LEDC API.
; Verified by building both envs; see .ai-changelog.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; M5Stack AtomS3R M12 = ESP32-S3-PICO-1-N8R8 (8MB flash + 8MB octal PSRAM).
; No dedicated PlatformIO board id exists for the AtomS3R family; the
; base "m5stack-atoms3" id targets the PSRAM-less AtomS3 instead. M5Stack's
; own docs use esp32-s3-devkitc-1 as the generic base with manual overrides.
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs
board_build.partitions = partitions_ota.csv
board_build.psram = enabled
; Octal PSRAM requires this memory_type; plain "enabled" above is not
; sufficient on its own for ESP32-S3-PICO-1-N8R8.
; DIO (not QIO) for flash: QIO requires the flash chip's Quad Enable status
; bit, which this module's flash isn't reliably reporting as set - the ROM
; bootloader hangs after "ets_loader.c 78" reading the 2nd-stage bootloader,
; the watchdog fires, and the board boot-loops. DIO doesn't depend on QE and
; sidesteps this. PSRAM stays on OPI (octal); this only affects flash access.
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio

extra_scripts = pre:version_build.py, merge_bin.py

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit NeoPixel @ ^1.12.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMQTT_MAX_PACKET_SIZE=2048
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; AtomS3R has no USB-UART bridge chip - native USB-CDC must be enabled
    ; explicitly or Serial output over the USB-C port stays silent.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Without this, app_config.cpp's default falls back to "ai_thinker",
    ; whose pin mapping drives GPIOs reserved for this chip's octal
    ; PSRAM/flash bus on a fresh/unconfigured board - hard watchdog reset.
    -DDEFAULT_CAMERA_MODEL=\"atoms3r_m12\"

monitor_filters =
    esp32_exception_decoder